name: GuardDog for SecureDrop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  guarddog:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3 # needed to diff the current commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install GuardDog
        run: pip install guarddog

      # currently, this runs on all dependencies. Some grep-fu necessary to get a requirement.txt-like file containing changes in more recent diff, similar to below:

      - name: Get diff of changed packages
        run: git diff HEAD^ HEAD requirements/*.txt | grep -Po '(?<=\+)[a-zA-Z-\/@.0-9]+==[.0-9\n\r]+' > requirements-diff.txt # this fails with exit code 1 if there is no grep match
        working-directory: ./securedrop/

      # check hashes?

      - run: guarddog pypi verify requirements-diff.txt --output-format sarif --exclude-rules repository_integrity_mismatch > guarddog.sarif
        working-directory: ./securedrop/

      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: guarddog-builtin
          sarif_file: ./securedrop/guarddog.sarif
